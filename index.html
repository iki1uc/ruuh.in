<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hopser – Fall – Aufstehen</title>
<style>
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #080910; color: #e9faff;
    font: 14px system-ui, sans-serif;
  }
  main { width: min(720px, 94vw) }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: .04em }
  p { margin: 0 0 14px; color: #8c9aa8 }
  .scene {
    position: relative; height: 390px; overflow: hidden;
    border: 1px solid #24313d; border-radius: 14px;
    background:
      linear-gradient(#101522 1px, transparent 1px),
      linear-gradient(90deg, #101522 1px, transparent 1px),
      radial-gradient(ellipse at 50% 100%, #15222a, #090b12 65%);
    background-size: 32px 32px, 32px 32px, auto;
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 42px;
    height: 2px; background: #00e5ff; box-shadow: 0 0 14px #00e5ff88;
  }
  .label {
    position: absolute; left: 14px; top: 12px; color: #71909d;
    font: 11px ui-monospace, monospace; letter-spacing: .12em;
  }
  .shadow {
    position: absolute; left: 50%; bottom: 31px; width: 58px; height: 10px;
    border-radius: 50%; background: #00e5ff55; filter: blur(5px);
    transform: translateX(-50%);
  }
  .figure {
    --lift: 0px;
    position: absolute; left: 50%; bottom: 44px;
    width: 58px; height: 112px; transform: translateX(-50%);
    transform-origin: 50% 100%;
  }
  .head {
    position: absolute; top: 0; left: 18px; width: 22px; height: 22px;
    border: 3px solid #ffd447; border-radius: 50%;
    background: #111824; box-shadow: 0 0 12px #ffd44766;
  }
  .body {
    position: absolute; top: 25px; left: 25px; width: 8px; height: 43px;
    background: #00e5ff; border-radius: 8px; box-shadow: 0 0 10px #00e5ff88;
  }
  .arm, .leg {
    position: absolute; width: 7px; border-radius: 8px;
    background: #bafaff; transform-origin: 50% 4px;
  }
  .arm { top: 31px; height: 31px; left: 12px; transform: rotate(24deg) }
  .arm.right { left: 39px; transform: rotate(-24deg) }
  .leg { top: 63px; height: 39px; left: 20px; transform: rotate(10deg) }
  .leg.right { left: 32px; transform: rotate(-10deg) }
  .figure.play { animation: sequence 7.2s ease-in-out both }
  .shadow.play { animation: shade 7.2s ease-in-out both }
  @keyframes sequence {
    0%, 4% { transform: translate(-50%, 0) rotate(0) }
    12% { transform: translate(-50%, -75px) rotate(0) } /* hop */
    18% { transform: translate(-50%, 0) rotate(0) }
    25% { transform: translate(-50%, 0) rotate(78deg) } /* fall */
    34% { transform: translate(-50%, 0) rotate(78deg) }
    45% { transform: translate(-50%, 0) rotate(0) } /* stand up */
    54% { transform: translate(-50%, -54px) rotate(0) } /* second hop */
    62% { transform: translate(-50%, 0) rotate(0) }
    70% { transform: translate(-50%, -185px) rotate(0) } /* ceiling jump */
    76% { transform: translate(-50%, -185px) rotate(0) }
    83% { transform: translate(-50%, 0) rotate(0) } /* land */
    89% { transform: translate(-50%, 0) rotate(78deg) } /* down on floor */
    100% { transform: translate(-50%, 0) rotate(78deg) }
  }
  @keyframes shade {
    0%, 4%, 18%, 25%, 34%, 45%, 62%, 83%, 89%, 100% { transform: translateX(-50%) scaleX(1); opacity: .8 }
    12%, 54% { transform: translateX(-50%) scaleX(.55); opacity: .35 }
    70%, 76% { transform: translateX(-50%) scaleX(.3); opacity: .2 }
  }
  .controls { display: flex; gap: 10px; align-items: center; margin-top: 12px }
  button {
    border: 1px solid #00e5ff66; border-radius: 8px; padding: 9px 14px;
    color: #071014; background: #00e5ff; font-weight: 700;
  }
  button:hover { background: #68f2ff }
  #status { color: #91adb8; font: 12px ui-monospace, monospace }
  @media (prefers-reduced-motion: reduce) {
    .figure.play, .shadow.play { animation-duration: 1ms }
  }
</style>
</head>
<body>
<main>
  <h1>Hopser → Fall → Aufstehen → Sprung → Boden</h1>
  <p>Die Figur hüpft, fällt hin, steht wieder auf, springt hoch und landet am Ende auf dem Boden.</p>
  <div class="scene" aria-label="Animierte Figur">
    <div class="label">BEWEGUNGSFELD · X / Y</div>
    <div class="floor"></div>
    <div class="shadow"></div>
    <div class="figure" id="figure" aria-hidden="true">
      <div class="head"></div><div class="body"></div>
      <div class="arm"></div><div class="arm right"></div>
      <div class="leg"></div><div class="leg right"></div>
    </div>
  </div>
  <div class="controls">
    <button id="start">▶ Noch mal abspielen</button>
    <span id="status" aria-live="polite">Bereit</span>
  </div>
</main>
<script>
  const figure = document.getElementById("figure");
  const shadow = document.querySelector(".shadow");
  const status = document.getElementById("status");
  const button = document.getElementById("start");

  function play() {
    figure.classList.remove("play");
    shadow.classList.remove("play");
    void figure.offsetWidth; // Animation zuverlässig neu starten
    figure.classList.add("play");
    shadow.classList.add("play");
    status.textContent = "Hopser läuft …";
    window.setTimeout(() => status.textContent = "Am Boden angekommen.", 7200);
  }

  button.addEventListener("click", play);
  play();
</script>
</body>
</html>
