<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PENTA.GRAM · 1NS</title>

<style>

:root{
 --bg:#050505;
 --card:#111;
 --line:#333;
 --green:#00ff66;
 --yellow:#ffd166;
 --red:#ff5555;
 --blue:#66ccff;
 --text:#f5f5f5;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Consolas,monospace;
}

header{
 padding:30px;
 text-align:center;
 border-bottom:2px solid var(--green);
}

h1{
 margin:0;
 color:var(--green);
}

.subtitle{
 color:#999;
 margin-top:8px;
}

.pipeline{
 text-align:center;
 padding:20px;
 color:var(--yellow);
 font-size:18px;
}

#liveStatus{
 padding:15px;
 text-align:center;
 border-bottom:1px solid var(--line);
}

.good{
 color:var(--green);
}

.warn{
 color:var(--yellow);
}

.bad{
 color:var(--red);
}

.portal{
 display:grid;
 gap:16px;
 padding:20px;
 grid-template-columns:
 repeat(
 auto-fit,
 minmax(260px,1fr)
 );
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:10px;
 padding:16px;
 text-decoration:none;
 color:white;
 transition:.2s;
}

.card:hover{
 transform:translateY(-3px);
 border-color:var(--green);
}

.card.ready{
 border-left:6px solid var(--green);
}

.card.failed{
 border-left:6px solid var(--red);
}

.role{
 color:var(--green);
 font-size:12px;
}

.score{
 margin-top:10px;
}

.errors{
 margin-top:10px;
 color:var(--red);
 font-size:12px;
}

.validator{
 padding:20px;
}

pre{
 background:#111;
 border:1px solid var(--line);
 padding:12px;
 overflow:auto;
}

footer{
 text-align:center;
 padding:30px;
 color:#888;
 border-top:1px solid var(--line);
}

</style>
</head>

<body>

<header>

<h1>PENTA.GRAM</h1>

<div class="subtitle">
ONE NAVIGATION SYSTEM
</div>

</header>

<div class="pipeline">

01.BOOT
↓

02.ID
↓

03.HBT
↓

04.PULSE

</div>

<div id="liveStatus">
Initialisiere ...
</div>

<section
id="portal"
class="portal">
</section>

<section class="validator">

<h2>VALIDATOR</h2>

<pre id="report"></pre>

</section>

<footer>

BOOT → ID → HBT → PULSE

</footer>

<script>

const PORTAL = [

{
 id:"boot",
 file:"01.boot.html",
 title:"BOOT",
 desc:"Start · Navigation · Routing",
 tiefe:81,
 stabil:true,
 konsistent:true,
 vollstaendig:true,
 nutzbar:true
},

{
 id:"id",
 file:"02.id.html",
 title:"IDENTITÄT",
 desc:"User · Ort · Status",
 tiefe:81,
 stabil:true,
 konsistent:true,
 vollstaendig:true,
 nutzbar:true
},

{
 id:"hbt",
 file:"03.hbt.html",
 title:"HBT",
 desc:"HALT · BEWERTUNG · TIEFE",
 tiefe:81,
 stabil:true,
 konsistent:true,
 vollstaendig:true,
 nutzbar:true
},

{
 id:"pulse",
 file:"04.pulse.html",
 title:"PULSE",
 desc:"Logik · Historie · Bindung",
 tiefe:729,
 stabil:true,
 konsistent:true,
 vollstaendig:true,
 nutzbar:true
}

];

const TESTS = [

{
 id:"STABIL",
 run:n=>n.stabil
},

{
 id:"KONSISTENT",
 run:n=>n.konsistent
},

{
 id:"VOLLSTAENDIG",
 run:n=>n.vollstaendig
},

{
 id:"NUTZBAR",
 run:n=>n.nutzbar
},

{
 id:"TIEFE",
 run:n=>[1,3,9,81,729]
 .includes(n.tiefe)
}

];

function validateNode(node){

 const errors=[];
 const passed=[];

 TESTS.forEach(t=>{

   const ok=t.run(node);

   if(ok)
    passed.push(t.id);
   else
    errors.push(t.id);

 });

 const score=
  Math.round(
   passed.length /
   TESTS.length *
   100
  );

 return{

  id:node.id,
  title:node.title,
  file:node.file,

  score,
  passed,
  errors,

  ready:
   errors.length===0

 };

}

function renderPortal(){

 const root=
  document
  .getElementById(
   "portal"
  );

 root.innerHTML="";

 PORTAL.forEach(node=>{

   const r=
    validateNode(node);

   const div=
    document
    .createElement("div");

   div.className=
    "card " +
    (
      r.ready
      ? "ready"
      : "failed"
    );

   div.innerHTML=`

    <div class="role">

    ${node.file}

    </div>

    <h2>

    ${node.title}

    </h2>

    <p>

    ${node.desc}

    </p>

    <div class="score">

    HBT:
    ${r.score}%

    </div>

    <div>

    Tiefe:
    ${node.tiefe}

    </div>

    ${
      r.errors.length
      ?
      `<div class="errors">
      FEHLER:
      ${r.errors.join(", ")}
      </div>`
      :
      `<div class="good">
      READY
      </div>`
    }

   `;

   root.appendChild(div);

 });

}

function renderStatus(){

 const data=
  PORTAL.map(
   validateNode
  );

 const ok=
  data.filter(
   x=>x.ready
  ).length;

 const pct=
  Math.round(
   ok /
   data.length *
   100
  );

 const cls=
  pct===100
  ? "good"
  : pct>=75
  ? "warn"
  : "bad";

 document
 .getElementById(
  "liveStatus"
 )
 .innerHTML=`

 <span class="${cls}">

 READY

 ${ok}

 /

 ${data.length}

 ·

 ${pct}%

 </span>

 `;

}

function renderReport(){

 const report=
  PORTAL.map(
    validateNode
  );

 document
 .getElementById(
  "report"
 )
 .textContent=

 JSON.stringify(
  report,
  null,
  2
 );

}

function refresh(){

 renderPortal();

 renderStatus();

 renderReport();

}

refresh();

setInterval(
 refresh,
 5000
);

</script>

</body>
</html>
