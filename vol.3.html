:root {
  color-scheme: dark;
  --bg: #101510;
  --panel: #181f19;

  --surface: #181f19;
  --surface-2: #20291f;

  --green: #61f58f;
  --yellow: #ffd27a;
  --red: #ff8a80;
  --blue: #6aa9ff;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Space Grotesk", system-ui, sans-serif;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

.status-konsens {
  border-color: #2f864d;
  background: #10311e;
  color: var(--green);
}

.status-teil {
  border-color: #8b6a14;
  background: #3b2f0d;
  color: var(--yellow);
}

.status-offen {
  border-color: #963131;
  background: #381616;
  color: var(--red);
}

.build {
  color: #61f58f;
  font-weight: 700;
}

.wait {
  color: #ffd27a;
  font-weight: 700;
}

input[type="range"] {
  accent-color: var(--accent);
  width: 100%;
  cursor: pointer;
}

input, textarea, select {
  font: inherit;
}

a:focus-visible, button:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 3px;
  border-radius: 6px;
}

input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 3px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.chain-arrow {
  color: var(--accent);
  font-weight: 700;
}

.nav-toggle {
  display: none;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  font-weight: 700;
  text-align: left;
}

.navbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.navbar a {
  display: inline-block;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 650;
  font-size: 0.85rem;
}

.navbar a:hover {
  color: var(--text);
  border-color: var(--accent);
}

.navbar a.active {
  background: #00ff66;
  color: black;
  border-color: #00ff66;
  font-weight: bold;
}

@media (max-width: 768px) {
  .nav-toggle {
    display: block;
  }

  .navbar {
    display: none;
    flex-direction: column;
    width: 100%;
  }

  .navbar.open {
    display: flex;
  }

  .navbar a {
    width: 100%;
    text-align: left;
    border-radius: 10px;
  }
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 18px;
  transition: .2s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: #00ff66;
}

.card.ready {
  border-left: 6px solid #00ff66;
}

.card.warn {
  border-left: 6px solid #ffd166;
}

.card.error {
  border-left: 6px solid #ff4444;
}

.card-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.card-title {
  margin: 0;
  color: var(--muted);
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .12em;
}

.icon-button {
  width: 36px;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
  color: var(--muted);
}

.icon-button:hover {
  border-color: var(--red);
  color: var(--red);
}

.slider-row {
  display: grid;
  grid-template-columns: 30px 1fr 28px;
  margin: 15px 0;
  align-items: center;
  gap: 12px;
}

.slider-row label {
  font-weight: 750;
}

.slider-value {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.result {
  display: grid;
  gap: 9px;
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}

.avg {
  color: var(--muted);
  font-size: .9rem;
}

.status, .gate {
  display: inline-flex;
  width: -moz-fit-content;
  width: fit-content;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: .78rem;
  font-weight: 750;
}

.gate-build {
  background: #10311e;
  color: var(--green);
}

.gate-wait {
  background: #3b2f0d;
  color: var(--yellow);
}

.values {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 18px 0;
}

.value {
  padding: 14px;
  background: #191919;
  border-radius: 8px;
}

.value span {
  display: block;
  color: #aaa;
  font-size: .85rem;
}

.value strong {
  font-size: 1.35rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button.macht {
  background: var(--green);
  color: #000;
  font-weight: 700;
}

button.macht:disabled {
  opacity: .55;
}

@media (max-width: 480px) {
  .values {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
